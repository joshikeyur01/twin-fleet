[project]
name = "simulators"
version = "0.1.0"
description = "Synthetic UR5 simulators: publish namespaced MQTT telemetry and react to commands (Gazebo stand-in)."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "contracts",
    "aiomqtt>=2.3",
    "structlog>=24.1",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulators"]
