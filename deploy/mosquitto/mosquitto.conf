# Mosquitto 2.x requires an explicit listener + auth stance (defaults changed
# from 1.x: no listener means localhost-only inside the container, useless
# behind Docker networking).
#
# Anonymous access is a deliberate dev-only choice, scoped to the compose
# network / localhost. One trust domain, N robots; mTLS and per-tenant auth are
# noted where they would attach but not implemented (see ARCHITECTURE.md).
#
# This is the BASELINE the load test attacks — deliberately untuned. If ADR-0005
# finds the broker knees first, its fix (e.g. max_inflight, a second broker
# sharded by robot_id topic prefix) lands here, and the ramp re-runs to show the
# knee moved.

listener 1883
allow_anonymous true

persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
