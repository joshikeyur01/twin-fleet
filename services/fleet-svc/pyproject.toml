[project]
name = "fleet-svc"
version = "0.1.0"
description = "Fleet registry (passive discovery over MQTT) and coordinated-command fan-out over command-svc."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "contracts",
    "aiomqtt>=2.3",         # passive discovery: subscribe to the telemetry stream
    "httpx2>=2.9",          # async client that fans commands out over command-svc's REST
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    # No influxdb-client: fleet-svc reads the fleet from MQTT and acts through
    # command-svc; it never touches storage (AGENTS.md).
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_svc"]
