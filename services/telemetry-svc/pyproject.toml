[project]
name = "telemetry-svc"
version = "0.1.0"
description = "Ingests namespaced MQTT telemetry, validates against contracts, writes to InfluxDB tagged by robot_id."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "contracts",
    "aiomqtt>=2.3",
    "influxdb-client[async]>=1.46",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_svc"]
