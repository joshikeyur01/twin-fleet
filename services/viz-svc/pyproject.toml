[project]
name = "viz-svc"
version = "0.1.0"
description = "Serves the React + react-three-fiber fleet viewer; proxies StreamState gRPC (whole fleet) into a WebSocket."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "contracts",           # brings grpcio + protobuf for the generated stubs
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",   # [standard] also provides the WebSocket impl
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viz_svc"]
