[project]
name = "state-svc"
version = "0.1.0"
description = "Computes derived state (end-effector pose, velocity RMS) per robot from MQTT telemetry; serves gRPC keyed by robot_id."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "contracts",           # brings grpcio + protobuf for the generated stubs
    "aiomqtt>=2.3",
    "numpy>=2.0",          # forward kinematics
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/state_svc"]
