[project]
name = "command-svc"
version = "0.1.0"
description = "Accepts REST commands for a robot, validates against contracts, publishes namespaced MQTT setpoints."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "contracts",
    "aiomqtt>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/command_svc"]
